<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Список задач</h1>

        <div class="input-box">
            <input
                type="text"
                id="taskInput"
                placeholder="Введите задачу..."
            >

            <button id="addButton">Добавить</button>
        </div>

        <div id="emptyMessage">
            Список задач пустой
        </div>

        <ul id="taskList"></ul>

    </div>

    <script src="script.js"></script>

</body>
</html>
